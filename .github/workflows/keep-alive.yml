name: Keep backend warm

on:
  schedule:
    # Well inside Render's free-plan 15-min idle sleep window.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: curl -fsS --max-time 90 https://averagepace-api.onrender.com/api/health
